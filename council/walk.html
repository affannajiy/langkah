<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The link carries a private token: never send it on, never index it. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Langkah live walk</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <style>
    /* Langkah colours (guide Section 6.2), as in style.css. */
    :root {
      --navy: #0F2A47; --surface: #F5F5F5; --white: #FFFFFF; --text: #1A1A2E; --muted: #4B5563;
      --interactive-text: #1F6FB2; --safe: #009E73; --safe-text: #006B4F; --safe-soft: #E3F4EE;
      --hazard-text: #8A5A00; --hazard-soft: #FDF3E0; --border: #D9DEE5; --pill: 999px; --touch: 48px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--surface); color: var(--text);
      font-family: 'Atkinson Hyperlegible Next', sans-serif; font-size: 16px; line-height: 1.45;
      display: flex; flex-direction: column;
    }
    h1, p { margin: 0; }
    :focus-visible { outline: 3px solid var(--interactive-text); outline-offset: 2px; }
    .top { background: var(--navy); color: var(--white); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
    .top img { border-radius: 8px; }
    .top b { font-size: 18px; }
    .top span { display: block; color: #B9D9F2; font-size: 14px; }
    .card {
      position: absolute; left: 16px; right: 16px; top: 16px; max-width: 480px; margin: 0 auto;
      background: var(--white); border-radius: 12px; padding: 16px;
      box-shadow: 0 4px 16px rgba(15, 42, 71, 0.18); display: grid; gap: 6px; z-index: 2;
    }
    .card h1 { font-size: 20px; line-height: 1.3; color: var(--navy); }
    .tag {
      justify-self: start; display: inline-flex; gap: 6px; align-items: center;
      padding: 2px 10px; border-radius: var(--pill); font-size: 14px; font-weight: 700;
    }
    .tag.live { background: var(--safe-soft); color: var(--safe-text); }
    .tag.done { background: var(--safe-soft); color: var(--safe-text); }
    .tag.stale, .tag.gone { background: var(--hazard-soft); color: var(--hazard-text); }
    .tag svg { width: 16px; height: 16px; }
    .eta { font-size: 26px; font-weight: 700; color: var(--safe-text); }
    .muted { color: var(--muted); font-size: 14px; }
    .wrap { position: relative; flex: 1; min-height: 0; }
    #map { position: absolute; inset: 0; }
    .follow {
      position: absolute; right: 16px; bottom: 48px; z-index: 2; min-height: var(--touch); padding: 0 18px;
      border: 1px solid var(--border); border-radius: var(--pill); background: var(--white); color: var(--navy);
      font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(15, 42, 71, 0.18);
    }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
    .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
    .key-you { width: 14px; height: 14px; border-radius: 50%; background: #1F6FB2; border: 3px solid #fff; box-shadow: 0 0 0 1px #1F6FB2; }
    .key-line { width: 22px; height: 4px; border-radius: 2px; background: var(--safe); }
    .key-end { width: 14px; height: 14px; border-radius: 50%; background: var(--navy); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--navy); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <img src="icon.png" alt="" width="36" height="36">
    <div><b>Langkah</b><span data-t="sub"></span></div>
  </header>
  <div class="wrap">
    <div id="map" role="region" aria-label=""></div>
    <section class="card" aria-live="polite">
      <span id="tag" class="tag" hidden></span>
      <h1 id="title"></h1>
      <p id="eta" class="eta" hidden></p>
      <p id="seen" class="muted" hidden></p>
      <div id="legend" class="legend" hidden>
        <span><i class="key-you"></i><span data-t="keyYou"></span></span>
        <span><i class="key-line"></i><span data-t="keyLine"></span></span>
        <span><i class="key-end"></i><span data-t="keyEnd"></span></span>
      </div>
      <p class="muted" data-t="privacy"></p>
    </section>
    <button type="button" id="follow" class="follow" hidden></button>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <script src="walk.js"></script>
</body>
</html>
